<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optrist Co | Deutz Diesel Engine Spare Parts</title>
  <meta name="description" content="Optrist Co — Unbeatable Quality Selection in Deutz diesel engine spare parts. Serving the Middle East since 2002.">
  <link rel="canonical" href="https://optristco.com/en/">
  <link rel="alternate" hreflang="en" href="https://optristco.com/en/">
  <link rel="alternate" hreflang="ar" href="https://optristco.com/ar/">
  <link rel="alternate" hreflang="de" href="https://optristco.com/de/">
  <link rel="alternate" hreflang="x-default" href="https://optristco.com/en/">
  <meta property="og:title" content="Optrist Co | Deutz Engine Spare Parts">
  <meta property="og:description" content="Unbeatable Quality Selection · Global Manufacturing Excellence · Serving the Middle East since 2002.">
  <meta property="og:image" content="https://optristco.com/images/optristlogowithoutouterglow.png">
  <meta property="og:url" content="https://optristco.com/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" href="favicon.png">
  
  <style>
    body {
      margin: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    .loader-box {
      text-align: center;
      padding: 2rem;
    }
    .loader-logo {
      width: 64px;
      height: auto;
      margin-bottom: 1.5rem;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.85; }
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #ecfdf5;
      border-top-color: #10b981;
      border-radius: 50%;
      margin: 0 auto 1.2rem;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      color: #64748b;
      font-size: 0.94rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="loader-box">
    <img src="images/optristlogo.PNG" alt="Optrist Co" class="loader-logo">
    <div class="spinner"></div>
    <div class="loader-text">Loading Optrist Co / جاري التحميل...</div>
  </div>

  <script>
    (function() {
      var middleEastTZ = [
        'Africa/Cairo', 'Africa/Tripoli', 'Africa/Tunis', 'Africa/Algiers',
        'Asia/Riyadh', 'Asia/Dubai', 'Asia/Baghdad', 'Asia/Kuwait',
        'Asia/Qatar', 'Asia/Bahrain', 'Asia/Aden', 'Asia/Muscat',
        'Asia/Amman', 'Asia/Beirut', 'Asia/Damascus', 'Asia/Jerusalem',
        'Asia/Gaza', 'Asia/Hebron', 'Africa/Khartoum'
      ];

      var tz = '';
      try {
        tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
      } catch(e) {}

      var lang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      lang = lang.toLowerCase();

      if (middleEastTZ.indexOf(tz) !== -1 || lang.startsWith('ar')) {
        window.location.replace('./ar/');
      } else if (lang.startsWith('de')) {
        window.location.replace('./de/');
      } else {
        window.location.replace('./en/');
      }
    })();
  </script>

  <noscript>
    <meta http-equiv="refresh" content="0; url=./en/">
  </noscript>
</body>
</html>
