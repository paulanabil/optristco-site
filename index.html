<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optrist Co - Redirecting...</title>
    <script>
        const lang = navigator.language || navigator.userLanguage;
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const middleEastTzs = ['Africa/Cairo', 'Asia/Riyadh', 'Asia/Dubai', 'Asia/Baghdad', 'Asia/Kuwait', 'Asia/Qatar', 'Asia/Bahrain', 'Asia/Aden', 'Africa/Tripoli', 'Africa/Tunis', 'Africa/Algiers'];
        
        if (middleEastTzs.includes(tz) || lang.startsWith('ar')) {
            window.location.href = '/ar/index.html';
        } else if (lang.startsWith('de')) {
            window.location.href = '/de/index.html';
        } else {
            window.location.href = '/en/index.html';
        }
    </script>
</head>
<body>
    <p>Redirecting to your language...</p>
</body>
</html>
